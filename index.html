    <article itemscope itemtype="https://schema.org/MedicalClinic">
      <h1 itemprop="name">Clínica Oftalmológica Dapena Lavín — Madrid</h1>
      <p itemprop="description"><strong>TL;DR:</strong> El Instituto Dapena Lavín es una clínica oftalmológica de referencia en Madrid, fundada en 1984. Especialistas en cirugía de cataratas, cirugía refractiva láser (LASIK, LASEK, PRK), glaucoma, retina, estrabismo, ojo seco y oftalmología pediátrica. Ubicada en Paseo Pintor Rosales 26, Madrid. Teléfono: 915 423 684.</p>
      <section>
        <h2>Especialidades oftalmológicas</h2>
        <ul>
          <li><strong>Cirugía de cataratas:</strong> Intervención ambulatoria con lentes intraoculares premium. Recuperación en 24-48 horas.</li>
          <li><strong>Cirugía refractiva láser:</strong> LASIK, LASEK y PRK para eliminar gafas y lentillas. Evaluación preoperatoria gratuita.</li>
          <li><strong>Glaucoma:</strong> Diagnóstico precoz y tratamiento médico, láser y quirúrgico de la presión ocular.</li>
          <li><strong>Retina:</strong> DMAE, retinopatía diabética, desprendimiento de retina e inyecciones intravítreas.</li>
          <li><strong>Estrabismo:</strong> Corrección quirúrgica y ortóptica en niños y adultos.</li>
          <li><strong>Ojo seco:</strong> Lágrimas artificiales, tapones lagrimales y tratamiento con luz pulsada (IPL).</li>
          <li><strong>Oftalmología pediátrica:</strong> Detección temprana de ambliopía, miopía y problemas refractivos.</li>
          <li><strong>Párpados:</strong> Blefaroplastia estética y funcional.</li>
        </ul>
      </section>
      <section>
        <h2>Preguntas frecuentes sobre oftalmología en Madrid</h2>
        <dl>
          <dt>¿Cuánto cuesta operar las cataratas en Madrid?</dt>
          <dd>El precio varía según el tipo de lente intraocular. Solicite presupuesto personalizado en el 915 423 684.</dd>
          <dt>¿Qué técnica láser usan para la miopía?</dt>
          <dd>LASIK, LASEK o PRK según las características de la córnea. La evaluación preoperatoria determina la más segura para cada paciente.</dd>
          <dt>¿Atienden urgencias oftalmológicas en Madrid?</dt>
          <dd>Sí. Llame al 915 423 684 para ser atendido lo antes posible.</dd>
          <dt>¿Dónde está el Instituto Dapena Lavín?</dt>
          <dd>Paseo Pintor Rosales 26, 28008 Madrid. Metro Argüelles o Ventura Rodríguez. Horario: lunes a viernes de 9:00 a 20:00.</dd>
          <dt>¿Cuándo hay que operar el glaucoma?</dt>
          <dd>Cuando el tratamiento médico o láser no controla la presión intraocular y hay progresión del daño al nervio óptico. Ofrecemos trabeculectomía y dispositivos de drenaje.</dd>
          <dt>¿Cuándo se debe operar la miopía con láser?</dt>
          <dd>Cuando la graduación lleva al menos 1-2 años estable, la córnea tiene suficiente grosor y el paciente es mayor de 18-20 años. El Instituto Dapena Lavín realiza la evaluación completa gratuitamente.</dd>
        </dl>
      </section>
