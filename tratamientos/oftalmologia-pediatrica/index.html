      <h1 itemprop="name">Oftalmología Pediátrica en Madrid — Clínica Dapena Lavín</h1>
      <p itemprop="description">Detección y tratamiento precoz de ambliopía, estrabismo, miopía infantil y otras patologías visuales en niños. Control de progresión miópica con ortoqueratología y atropina.</p>
      <section>
        <h2>Preguntas frecuentes</h2>
        <dl>
          <dt>¿Cuándo llevar a un niño al oftalmólogo por primera vez?</dt>
          <dd>Entre los 3 y los 5 años. Si hay antecedentes de estrabismo o miopía alta familiar, antes de los 3 años.</dd>
          <dt>¿Qué es la ambliopía o ojo vago?</dt>
          <dd>Reducción de la agudeza visual en un ojo sin lesión orgánica. El tratamiento con parche es efectivo si se inicia antes de los 7-8 años.</dd>
          <dt>¿Se puede frenar la miopía en niños?</dt>
          <dd>Sí. La ortoqueratología, las lentes de contacto de diseño especial y la atropina a baja dosis son técnicas validadas.</dd>
          <dt>¿La miopía alta en adultos tiene más riesgo?</dt>
          <dd>Sí. La miopía mayor de 6 dioptrías multiplica el riesgo de desprendimiento de retina y glaucoma.</dd>
        </dl>
      </section>
