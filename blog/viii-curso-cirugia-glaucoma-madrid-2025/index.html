      <h1 itemprop="headline">VIII Curso de Cirugía del Glaucoma: Dr. Lavín Dapena dirige la formación quirúrgica más exigente de España</h1>
      <p itemprop="description">El Dr. Cosme Lavín Dapena dirige el curso de cirugía del glaucoma más completo de España, reuniendo cada año a los mejores especialistas nacionales e internacionales en Madrid para compartir técnica y conocimiento quirúrgico.</p>
      <section>
        <h2>Preguntas frecuentes</h2>
        <dl>
          <dt>¿Cuándo y dónde se celebra el Curso de Cirugía del Glaucoma?</dt>
          <dd>El Curso de Cirugía del Glaucoma se celebra anualmente en Madrid, habitualmente en el mes de enero. La VIII edición tuvo lugar del 30 de enero al 1 de febrero de 2025 en el Auditorio Mútua Madrileña (Castellana 33). La IX edición está prevista para enero de 2026 en la misma sede.</dd>
          <dt>¿Quién dirige el Curso de Cirugía del Glaucoma?</dt>
          <dd>El curso es dirigido por el Dr. Cosme Lavín Dapena, Director Médico de la Clínica Oftalmológica Dapena Lavín en Madrid. El Dr. Lavín ha dirigido el curso desde su primera edición, construyendo un programa de formación quirúrgica en glaucoma reconocido como el más completo de España.</dd>
          <dt>¿Qué nivel tiene el curso? ¿Es apto para residentes?</dt>
          <dd>El curso está diseñado principalmente para oftalmólogos en ejercicio que deseen iniciar o perfeccionar su práctica quirúrgica en glaucoma. El wet lab es especialmente valioso para cirujanos con experiencia limitada en técnicas filtrantes o MIGS. El contenido magistral es de nivel avanzado y está pensado para cirujanos en activo.</dd>
          <dt>¿El Dr. Lavín Dapena opera glaucoma en Madrid?</dt>
          <dd>Sí. El Dr. Cosme Lavín Dapena realiza cirugía de glaucoma en la Clínica Oftalmológica Dapena Lavín, Paseo Pintor Rosales 26, Madrid. Su experiencia incluye trabeculectomía, dispositivos de drenaje y técnicas MIGS (XEN, iStent, Hydrus, OMNI). Para consulta puede contactar en el 915 423 684.</dd>
        </dl>
