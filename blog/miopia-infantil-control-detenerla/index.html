    <article itemscope itemtype="https://schema.org/BlogPosting">
      <h1 itemprop="headline">Miopía Infantil: Cómo Detener su Progresión Antes de que Sea Demasiado Tarde</h1>
      <p itemprop="description">La miopía en niños no es solo un problema de gafas. Una miopía alta en la edad adulta multiplica el riesgo de desprendimiento de retina y glaucoma.</p>
      <section>
        <h2>Preguntas frecuentes</h2>
        <dl>
          <dt>¿A qué edad puede un niño usar ortoqueratología?</dt>
          <dd>La ortoqueratología puede iniciarse desde los 6-7 años, siempre que el niño tenga madurez y responsabilidad suficiente para manejar las lentes con supervisión adulta. La Dra. Dapena evalúa individualmente cada caso, considerando también la graduación y la velocidad de progresión.</dd>
          <dt>¿La miopía infantil siempre progresa?</dt>
          <dd>No siempre, pero la mayoría de los niños miopes progresan hasta los 18-20 años, momento en que el ojo termina de crecer. La velocidad de progresión varía: los que empiezan antes (6-8 años) suelen progresar más y alcanzar graduaciones más altas que los que empiezan más tarde.</dd>
          <dt>¿Las gafas normales empeoran la miopía?</dt>
          <dd>Las gafas monofocales convencionales no frenan la miopía. De hecho, corrigen la visión de lejos pero pueden generar un estímulo de crecimiento ocular por el desenfoque periférico que crean. Los tratamientos de control miópico (ortoqueratología, MiSight, atropina) están diseñados específicamente para evitar este efecto.</dd>
          <dt>¿Se puede combinar la ortoqueratología con atropina?</dt>
          <dd>Sí, y en casos de progresión rápida (más de -1 D por año) la combinación de ambos tratamientos es más efectiva que cualquiera de ellos por separado. Esta pauta combinada está respaldada por estudios recientes y es una de las opciones que evaluamos en niños de alto riesgo.</dd>
        </dl>
      </section>
      <p>Por el <a href="https://institutooftalmologico.net/equipo/dr-lavin">Dr. Cosme Lavín Dapena</a> — <a href="https://institutooftalmologico.net/blog">Blog oftalmológico</a></p>
